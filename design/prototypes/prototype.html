<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AetherWall Phase 0 Prototypes</title>
<style>
  /* =====================================================================
     AetherWall Phase 0 Prototype — design system tokens
     Ref: design/design-system/tokens.css
     ===================================================================== */
  :root {
    --aw-background: #0b0b10;
    --aw-surface-1: #14131b;
    --aw-surface-2: #1d1a27;
    --aw-surface-3: #242034;
    --aw-border: #343044;
    --aw-border-strong: #4a435c;
    --aw-divider: #2a2538;
    --aw-primary: #8b3ddb;
    --aw-primary-hover: #a855f7;
    --aw-primary-soft: rgba(139, 61, 219, 0.18);
    --aw-accent: #d946ef;
    --aw-accent-soft: rgba(217, 70, 239, 0.18);
    --aw-secondary-accent: #38bdf8;
    --aw-text-primary: #f5f3fa;
    --aw-text-secondary: #aaa5b8;
    --aw-text-muted: #7a728a;
    --aw-success: #34d399;
    --aw-warning: #fbbf24;
    --aw-error: #fb7185;
    --aw-info: #60a5fa;
    --aw-elevation-1: 0 1px 2px rgba(0,0,0,0.4), 0 0 0 1px var(--aw-divider);
    --aw-elevation-2: 0 4px 12px rgba(0,0,0,0.45), 0 0 0 1px var(--aw-divider);
    --aw-elevation-3: 0 8px 24px rgba(0,0,0,0.55), 0 0 0 1px var(--aw-border-strong);
    --aw-gradient-primary: linear-gradient(135deg, #8b3ddb 0%, #a855f7 100%);
    --aw-gradient-accent: linear-gradient(135deg, #d946ef 0%, #f472b6 100%);
    --aw-gradient-hero: radial-gradient(ellipse 60% 50% at center, #1a1230 0%, #0b0b10 70%);
    --aw-font-sans: "Inter", "Segoe UI", system-ui, -apple-system, sans-serif;
    --aw-font-mono: "JetBrains Mono", "Fira Code", "Cascadia Code", monospace;
    --aw-text-xs: 0.75rem;
    --aw-text-sm: 0.8125rem;
    --aw-text-base: 0.875rem;
    --aw-text-lg: 1rem;
    --aw-text-xl: 1.125rem;
    --aw-text-2xl: 1.375rem;
    --aw-text-3xl: 1.625rem;
    --aw-text-4xl: 2.25rem;
    --aw-leading-normal: 1.4;
    --aw-leading-relaxed: 1.6;
    --aw-space-1: 4px;
    --aw-space-2: 8px;
    --aw-space-3: 12px;
    --aw-space-4: 16px;
    --aw-space-6: 24px;
    --aw-space-8: 32px;
    --aw-space-10: 40px;
    --aw-space-12: 48px;
    --aw-radius-sm: 4px;
    --aw-radius-md: 8px;
    --aw-radius-lg: 12px;
    --aw-radius-xl: 16px;
    --aw-radius-full: 9999px;
    --aw-z-drop: 20;
    --aw-z-overlay: 30;
    --aw-transition-fast: 120ms ease;
    --aw-transition-base: 180ms ease;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: var(--aw-font-sans);
    font-size: var(--aw-text-base);
    line-height: var(--aw-leading-normal);
    color: var(--aw-text-primary);
    background: var(--aw-background);
    -webkit-font-smoothing: antialiased;
    overflow: hidden;
  }
  /* Scrollbar styling */
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-track { background: var(--aw-surface-1); }
  ::-webkit-scrollbar-thumb { background: var(--aw-border-strong); border-radius: var(--aw-radius-sm); }
  ::-webkit-scrollbar-thumb:hover { background: var(--aw-primary); }

  /* Layout */
  #app { display: flex; flex-direction: column; height: 100%; }
  .shell { display: flex; flex-direction: column; height: 100%; }

  /* Desktop preview */
  .preview {
    background: var(--aw-gradient-hero);
    border-bottom: 1px solid var(--aw-border);
    min-height: 200px;
    display: flex;
    flex-direction: column;
    padding: var(--aw-space-4);
    gap: var(--aw-space-3);
  }
  .preview-label {
    display: flex; align-items: center; gap: var(--aw-space-2);
    font-size: var(--aw-text-sm); color: var(--aw-text-secondary);
  }
  .preview-label .badge {
    background: rgba(255,255,255,0.08); color: var(--aw-text-secondary);
    padding: 2px 8px; border-radius: var(--aw-radius-sm); font-size: var(--aw-text-xs);
  }
  .preview .display-selector {
    background: var(--aw-surface-2); border: 1px solid var(--aw-border-strong);
    color: var(--aw-text-primary); padding: var(--aw-space-2) var(--aw-space-3);
    border-radius: var(--aw-radius-md); font-size: var(--aw-text-base);
  }
  .preview .size-ctrl {
    display: flex; gap: var(--aw-space-2); align-items: center;
  }
  .preview .size-ctrl button {
    background: var(--aw-surface-2); color: var(--aw-text-primary);
    border: 1px solid var(--aw-border-strong); padding: var(--aw-space-1) var(--aw-space-3);
    border-radius: var(--aw-radius-md); cursor: pointer; font-size: var(--aw-text-sm);
  }
  .preview .size-ctrl button:hover { background: var(--aw-surface-3); border-color: var(--aw-border); }
  .preview .apply-row { display: flex; gap: var(--aw-space-2); }
  .preview .apply-row button {
    background: var(--aw-gradient-primary); color: #fff; border: none;
    padding: var(--aw-space-2) var(--aw-space-4); border-radius: var(--aw-radius-md);
    font-weight: 600; cursor: pointer; font-size: var(--aw-text-sm);
  }
  .preview .apply-row button:hover { filter: brightness(1.1); }
  .preview .fallback-snapshot {
    flex: 1; background: var(--aw-surface-3); border-radius: var(--aw-radius-lg);
    display: flex; align-items: center; justify-content: center; min-height: 0;
  }
  .preview .fallback-snapshot .icon { font-size: 48px; color: var(--aw-text-muted); }

  /* Studio area */
  .studio {
    flex: 1; display: flex; overflow: hidden;
    background: var(--aw-surface-1);
  }
  .nav {
    width: 154px; background: var(--aw-surface-1);
    border-right: 1px solid var(--aw-border); display: flex; flex-direction: column;
    padding: var(--aw-space-2) var(--aw-space-2); gap: var(--aw-space-1);
    overflow-y: auto;
  }
  .nav-item {
    display: flex; align-items: center; gap: var(--aw-space-3); padding: var(--aw-space-3) var(--aw-space-4);
    color: var(--aw-text-secondary); border-radius: var(--aw-radius-md); cursor: pointer; font-size: var(--aw-text-sm);
    transition: background var(--aw-transition-fast), color var(--aw-transition-fast);
  }
  .nav-item:hover { background: var(--aw-surface-2); color: var(--aw-text-primary); }
  .nav-item.active { background: var(--aw-surface-2); color: var(--aw-primary); border-left: 3px solid var(--aw-primary); }
  .nav-item .icon { font-size: 20px; width: 24px; text-align: center; }

  /* Category chips */
  .category-chips {
    flex: 1; display: flex; flex-direction: column; gap: var(--aw-space-2); padding: var(--aw-space-2);
    overflow: auto;
  }
  .chip {
    display: flex; align-items: center; gap: var(--aw-space-3); padding: var(--aw-space-3) var(--aw-space-4);
    background: var(--aw-surface-1); border: 1px solid var(--aw-border); border-radius: var(--aw-radius-md);
    color: var(--aw-text-secondary); cursor: pointer; font-size: var(--aw-text-sm);
    transition: all var(--aw-transition-fast);
  }
  .chip:hover { border-color: var(--aw-border-strong); color: var(--aw-text-primary); }
  .chip .count { color: var(--aw-text-muted); font-size: var(--aw-text-xs); }

  /* Main content area */
  .main {
    flex: 1; overflow: auto; padding: var(--aw-space-6);
  }
  .main-header {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: var(--aw-space-4);
  }
  .main-header h1 { font-size: var(--aw-text-2xl); font-weight: 600; }
  .back-btn {
    background: var(--aw-surface-2); color: var(--aw-text-primary); border: 1px solid var(--aw-border-strong);
    padding: var(--aw-space-2) var(--aw-space-3); border-radius: var(--aw-radius-md); cursor: pointer; font-size: var(--aw-text-sm);
  }
  .back-btn:hover { border-color: var(--aw-border); }

  /* Search */
  .search-bar {
    background: var(--aw-surface-2); border: 1px solid var(--aw-border-strong);
    color: var(--aw-text-primary); padding: var(--aw-space-2) var(--aw-space-4);
    border-radius: var(--aw-radius-md); font-size: var(--aw-text-base); width: 100%;
  }
  .search-bar:focus { outline: none; border-color: var(--aw-primary); }

  /* Media grid */
  .media-grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: var(--aw-space-4);
  }
  .media-card {
    background: var(--aw-surface-1); border: 1px solid var(--aw-border); border-radius: var(--aw-radius-lg);
    overflow: hidden; cursor: pointer; transition: all var(--aw-transition-fast);
  }
  .media-card:hover { border-color: var(--aw-border-strong); box-shadow: var(--aw-elevation-2); }
  .media-card .thumb {
    height: 140px; background: var(--aw-surface-3); display: flex; align-items: center; justify-content: center;
  }
  .media-card .thumb .img { width: 100%; height: 100%; object-fit: cover; }
  .media-card .meta { padding: var(--aw-space-3); }
  .media-card .meta .title { font-weight: 600; font-size: var(--aw-text-base); margin-bottom: var(--aw-space-1); }
  .media-card .meta .sub { font-size: var(--aw-text-xs); color: var(--aw-text-muted); }
  .fav-btn {
    position: absolute; top: var(--aw-space-2); right: var(--aw-space-2); background: rgba(0,0,0,0.5);
    color: var(--aw-text-secondary); border: none; border-radius: var(--aw-radius-sm); padding: 4px 6px; cursor: pointer;
  }
  .fav-btn:hover { color: var(--aw-accent); }

  /* Skeleton loading */
  .skeleton {
    background: linear-gradient(90deg, var(--aw-surface-3) 25%, var(--aw-surface-2) 50%, var(--aw-surface-3) 75%);
    background-size: 200% 100%; animation: shimmer 1.2s infinite;
  }
  @keyframes shimmer { to { background-position: -200% 0; } }

  /* Forms */
  .form-group { margin-bottom: var(--aw-space-4); }
  .form-group label { display: block; font-size: var(--aw-text-sm); color: var(--aw-text-secondary); margin-bottom: var(--aw-space-2); }
  .form-group select, .form-group input, .form-group textarea {
    width: 100%; background: var(--aw-surface-2); border: 1px solid var(--aw-border-strong);
    color: var(--aw-text-primary); padding: var(--aw-space-2) var(--aw-space-3); border-radius: var(--aw-radius-md); font-size: var(--aw-text-base);
  }
  .form-group select:focus, .form-group input:focus, .form-group textarea:focus {
    outline: none; border-color: var(--aw-primary);
  }
  .btn {
    display: inline-flex; align-items: center; gap: var(--aw-space-2); padding: var(--aw-space-2) var(--aw-space-4);
    border-radius: var(--aw-radius-md); cursor: pointer; font-size: var(--aw-text-base); font-weight: 600; border: none;
    transition: all var(--aw-transition-fast); font-family: var(--aw-font-sans);
  }
  .btn-primary { background: var(--aw-gradient-primary); color: #fff; }
  .btn-primary:hover { filter: brightness(1.1); }
  .btn-ghost {
    background: transparent; color: var(--aw-text-primary);
    border: 1px solid var(--aw-border-strong);
  }
  .btn-ghost:hover { border-color: var(--aw-border); background: var(--aw-surface-2); }
  .btn-accent { background: var(--aw-accent); color: #fff; }
  .btn-accent:hover { filter: brightness(1.1); }
  .btn-block { width: 100%; }
  .btn-sm { padding: var(--aw-space-1) var(--aw-space-2); font-size: var(--aw-text-sm); }

  /* Spinner */
  .spinner {
    width: 20px; height: 20px; border: 2px solid var(--aw-border); border-top-color: var(--aw-primary);
    border-radius: 50%; animation: spin 0.8s linear infinite; display: inline-block;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* State boxes */
  .state-box {
    background: var(--aw-surface-2); border: 1px solid var(--aw-border-strong); border-radius: var(--aw-radius-lg);
    padding: var(--aw-space-8); text-align: center;
  }
  .state-box .icon { font-size: 48px; color: var(--aw-text-muted); margin-bottom: var(--aw-space-3); }
  .state-box .title { font-size: var(--aw-text-xl); font-weight: 600; margin-bottom: var(--aw-space-2); }
  .state-box .desc { font-size: var(--aw-text-sm); color: var(--aw-text-secondary); }

  /* Web editor */
  .editor-grid { display: grid; grid-template-columns: 260px 1fr 1fr; gap: var(--aw-space-0); height: 100%; }
  .editor-panel { background: var(--aw-surface-1); border: 1px solid var(--aw-border); border-radius: var(--aw-radius-lg); overflow: hidden; display: flex; flex-direction: column; }
  .editor-panel-title {
    padding: var(--aw-space-3); font-weight: 600; font-size: var(--aw-text-sm); color: var(--aw-text-secondary); border-bottom: 1px solid var(--aw-border);
    display: flex; align-items: center; gap: var(--aw-space-2);
  }
  .editor-panel-body { flex: 1; overflow: auto; padding: var(--aw-space-4); font-family: var(--aw-font-mono); font-size: var(--aw-text-sm); }
  .editor-panel-body editor, .editor-panel-body textarea { width: 100%; height: 100%; background: var(--aw-surface-2); color: var(--aw-text-primary); border: 1px solid var(--aw-border); border-radius: var(--aw-radius-md); padding: var(--aw-space-2); font-family: var(--aw-font-mono); font-size: var(--aw-text-sm); }
  .editor-preview { background: var(--aw-surface-1); border: 1px solid var(--aw-border); border-radius: var(--aw-radius-lg); display: flex; align-items: center; justify-content: center; height: 100%; }
  .editor-preview .demo {
    width: 100%; height: 100%; background: var(--aw-gradient-hero); display: flex; flex-direction: column; align-items: center; justify-content: center; padding: var(--aw-space-8);
  }
  .editor-preview .demo .mock {
    width: 100%; max-width: 320px; padding: var(--aw-space-4);
    background: var(--aw-surface-1); border: 1px solid var(--aw-border); border-radius: var(--aw-radius-lg); text-align: center;
  }
  .editor-preview .demo .mock h3 { color: var(--aw-text-primary); margin-bottom: var(--aw-space-2); }
  .editor-preview .demo .mock p { color: var(--aw-text-secondary); font-size: var(--aw-text-sm); }

  /* 3D editor */
  .three-editor {
    display: grid; grid-template-columns: 260px 1fr 260px; height: 100%; background: var(--aw-surface-1);
  }
  .three-editor .panel {
    background: var(--aw-surface-1); border: 1px solid var(--aw-border); border-radius: var(--aw-radius-lg); overflow: hidden;
  }
  .three-editor .viewport {
    background: var(--aw-surface-3); border: 1px solid var(--aw-border); border-radius: var(--aw-radius-lg); display: flex;
    align-items: center; justify-content: center; position: relative; overflow: hidden;
  }
  .three-editor .viewport canvas { width: 100%; height: 100%; }
  .three-editor .panel-title {
    padding: var(--aw-space-3); font-weight: 600; font-size: var(--aw-text-sm); color: var(--aw-text-secondary); border-bottom: 1px solid var(--aw-border);
  }
  .three-editor .panel-body { padding: var(--aw-space-4); overflow: auto; }
  .three-editor .panel-body h4 { font-size: var(--aw-text-sm); color: var(--aw-text-secondary); margin-bottom: var(--aw-space-3); margin-top: var(--aw-space-4); }
  .three-editor .panel-body ul { list-style: none; }
  .three-editor .panel-body li {
    display: flex; justify-content: space-between; padding: var(--aw-space-2) 0;
    border-bottom: 1px solid var(--aw-border); font-size: var(--aw-text-sm);
  }
  .three-editor .panel-body li:last-child { border-bottom: none; }

  /* Slideshow */
  .playlist {
    display: flex; flex-direction: column; gap: var(--aw-space-2); max-width: 800px;
  }
  .playlist-item {
    display: flex; align-items: center; gap: var(--aw-space-3); padding: var(--aw-space-3);
    background: var(--aw-surface-1); border: 1px solid var(--aw-border); border-radius: var(--aw-radius-md);
    cursor: pointer;
  }
  .playlist-item .thumb { width: 64px; height: 64px; background: var(--aw-surface-3); border-radius: var(--aw-radius-md); flex-shrink: 0; }
  .playlist-item .info { flex: 1; }
  .playlist-item .info .title { font-weight: 600; font-size: var(--aw-text-sm); }
  .playlist-item .info .meta { font-size: var(--aw-text-xs); color: var(--aw-text-muted); }
  .drag-handle { color: var(--aw-text-muted); cursor: grabber; font-size: 18px; }

  /* Games */
  .game-card {
    background: var(--aw-surface-1); border: 1px solid var(--aw-border); border-radius: var(--aw-radius-lg);
    overflow: hidden; cursor: pointer; transition: all var(--aw-transition-fast);
  }
  .game-card:hover { border-color: var(--aw-border-strong); box-shadow: var(--aw-elevation-2); }
  .game-card .thumb { height: 140px; background: var(--aw-surface-3); display: flex; align-items: center; justify-content: center; }
  .game-card .info { padding: var(--aw-space-4); }
  .game-card .info .title { font-weight: 600; font-size: var(--aw-text-base); }
  .game-card .info .desc { font-size: var(--aw-text-sm); color: var(--aw-text-secondary); margin-top: var(--aw-space-1); }
  .game-card .info .meta { display: flex; gap: var(--aw-space-3); margin-top: var(--aw-space-3); font-size: var(--aw-text-xs); color: var(--aw-text-muted); }

  /* Downloads */
  .download-item {
    display: flex; align-items: center; gap: var(--aw-space-4); padding: var(--aw-space-4);
    background: var(--aw-surface-1); border: 1px solid var(--aw-border); border-radius: var(--aw-radius-md); margin-bottom: var(--aw-space-2);
  }
  .download-item .info { flex: 1; }
  .download-item .info .title { font-weight: 600; font-size: var(--aw-text-base); }
  .download-item .info .meta { font-size: var(--aw-text-xs); color: var(--aw-text-muted); }
  .download-item .progress { flex: 2; }
  .download-item .progress .bar { height: 6px; background: var(--aw-surface-3); border-radius: var(--aw-radius-sm); overflow: hidden; }
  .download-item .progress .bar > div { height: 100%; background: var(--aw-primary); border-radius: var(--aw-radius-sm); transition: width 0.3s; }

  /* Diagnostics log */
  .log-viewer {
    background: var(--aw-surface-2); border: 1px solid var(--aw-border-strong); border-radius: var(--aw-radius-lg);
    height: 200px; overflow: auto; padding: var(--aw-space-4); font-family: var(--aw-font-mono); font-size: var(--aw-text-xs);
  }
  .log-viewer .line { padding: 2px 0; color: var(--aw-text-secondary); border-bottom: 1px solid var(--aw-divider); }
  .log-viewer .line.error { color: var(--aw-error); }

  /* Settings */
  .settings-group {
    background: var(--aw-surface-1); border: 1px solid var(--aw-border); border-radius: var(--aw-radius-lg);
    padding: var(--aw-space-4); margin-bottom: var(--aw-space-3);
  }
  .settings-group h3 {
    font-size: var(--aw-text-lg); font-weight: 600; margin-bottom: var(--aw-space-3); padding-bottom: var(--aw-space-3);
    border-bottom: 1px solid var(--aw-border); color: var(--aw-text-primary);
  }
  .settings-group .item {
    display: flex; justify-content: space-between; align-items: center;
    padding: var(--aw-space-2) 0; border-bottom: 1px solid var(--aw-border); font-size: var(--aw-text-sm);
  }
  .settings-group .item:last-child { border-bottom: none; }
  .settings-group .item .label { color: var(--aw-text-secondary); }
  .settings-group .item .value { color: var(--aw-text-primary); }

  /* Override for demo purposes */
  .demo-overlay { position: fixed; inset: 0; z-index: 9999; background: rgba(0,0,0,0.7); display: flex; align-items: center; justify-content: center; color: var(--aw-text-primary); }
  .demo-overlay .box { background: var(--aw-surface-1); padding: var(--aw-space-8); border-radius: var(--aw-radius-xl); border: 1px solid var(--aw-border-strong); }
  .demo-overlay .box h2 { margin-bottom: var(--aw-space-4); }
  .demo-overlay .box p { color: var(--aw-text-secondary); margin-bottom: var(--aw-space-4); }
  .demo-overlay .box button { padding: var(--aw-space-2) var(--aw-space-6); }

  @media (max-width: 1100px) {
    .editor-grid, .three-editor { grid-template-columns: 1fr; grid-template-rows: auto 1fr auto; }
    .nav { width: 64px; }
    .nav-item span { display: none; }
    .nav-item { justify-content: center; padding: var(--aw-space-3); }
    .nav-item .icon { width: auto; }
    .category-chips { flex-direction: row; flex-wrap: wrap; }
    .chip { flex: 1; min-width: calc(33.333% - var(--aw-space-2)); }
  }
  @media (max-width: 768px) {
    .studio { flex-direction: column; }
    .nav { position: fixed; top: 0; left: 0; height: 100%; z-index: 100; }
    .main { padding: var(--aw-space-4); }
  }
</style>
</head>
<body>
<div id="app">
  <div class="shell">
    <div class="preview">
      <div class="preview-label">
        <span class="badge">Desktop preview</span>
        <span style="margin-left:auto;">Display: <select class="display-selector"><option>Primary Display (1920×1080)</option><option>Aux Display (1920×1200)</option></select></span>
      </div>
      <div class="fallback-snapshot">
        <div class="icon">🖼️</div>
        <div style="color:var(--aw-text-secondary);font-size:var(--aw-text-sm);">Preview snapshot — not a live wallpaper</div>
      </div>
      <div class="apply-row">
        <button>Apply to Display</button>
        <div class="size-ctrl">
          <button>A</button>
          <button>B</button>
          <button>S</button>
        </div>
      </div>
    </div>
    <div class="studio">

function renderScreen(name) {
  const main = document.getElementById('main');
  const navItems = document.querySelectorAll('.nav-item');
  const content = screens[name] || screens.home;
  main.innerHTML = content;
  navItems.forEach(item => {
    item.classList.toggle('active', item.dataset.screen === name);
  });
}

document.querySelectorAll('.nav-item').forEach(item => {
  item.addEventListener('click', () => {
    const screen = item.dataset.screen;
    renderScreen(screen);
  });
});
